<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2 - Loop & Fungsi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-6 max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold">Latihan 2: Loop & Fungsi</h1>

    <div id="result" class="space-y-4"></div>

    <!-- 4. Kalkulator BMI -->
    <div class="p-4 border rounded bg-gray-50">
        <h2 class="text-lg font-bold mb-3">4. Kalkulator BMI (Body Mass Index)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
            <input type="number" id="berat-badan" placeholder="Berat Badan (kg)" class="border p-2 rounded bg-white">
            <input type="number" id="tinggi-badan" placeholder="Tinggi Badan (cm)" class="border p-2 rounded bg-white">
        </div>
        <button id="btn-hitung-bmi" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Hitung
            BMI</button>
        <div id="hasil-bmi" class="mt-3 font-semibold"></div>
    </div>

    <!-- 5. FizzBuzz -->
    <div class="p-4 border rounded">
        <h2 class="text-lg font-bold mb-3">5. Program FizzBuzz (1 - 100)</h2>
        <div id="fizzbuzz-output" class="flex flex-wrap gap-1.5 text-sm"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
