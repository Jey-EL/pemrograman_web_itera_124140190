name: Deploy Pertemuan 1, 2, dan 3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Siapkan folder website
        run: |
          mkdir -p public/pertemuan1 public/pertemuan2 public/pertemuan3

          cp -r JundiLamtara_124140190_pertemuan1/. public/pertemuan1/
          cp -r JundiLamtara_124140190_pertemuan2/. public/pertemuan2/

          npm ci --prefix JundiLamtara_124140190_pertemuan3/manajemen-buku-pribadi
          npm run build --prefix JundiLamtara_124140190_pertemuan3/manajemen-buku-pribadi
          cp -r JundiLamtara_124140190_pertemuan3/manajemen-buku-pribadi/dist/. public/pertemuan3/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
