<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 6 - Modern Array Methods</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">
                Latihan Praktikum: Modern Array Methods
            </h1>
            <p class="text-gray-600">
                groupBy dengan reduce(), rata-rata array of objects, flatten struktur bersarang, dan chaining
                filter-map-reduce
            </p>
        </header>

        <main class="bg-white p-6 rounded-lg shadow-md">
            <div id="output" class="space-y-4"></div>

            <div class="flex space-x-4 mt-8">
                <button id="runLatihanBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded font-medium transition duration-150">
                    Jalankan Latihan
                </button>
                <button id="clearBtn"
                    class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded font-medium transition duration-150">
                    Clear Output
                </button>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
